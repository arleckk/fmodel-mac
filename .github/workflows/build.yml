# Builds FModel.app from a clean checkout on a GitHub-hosted Apple Silicon runner (free for public repositories):
# fetches the pinned FModel/CUE4Parse sources, builds vgmstream and unluac (cached until their scripts change),
# runs the headless regression against CUE4Parse's test fixtures and packages the app. On a published release, the
# zipped app is attached to it.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Upstream sources (FModel, CUE4Parse + patch)
        run: scripts/setup-upstream.sh

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/**/*.csproj', 'app/Directory.Build.props', 'poc/**/*.csproj', 'patches/CUE4Parse.patch') }}
          restore-keys: nuget-${{ runner.os }}-

      # Only what the app bundle needs: the two binaries and the license files build-app.sh ships with them
      - name: Cache vgmstream and unluac
        id: vendor
        uses: actions/cache@v6
        with:
          path: |
            vendor/vgmstream-build/vgmstream-cli
            vendor/vgmstream-src/*/COPYING*
            vendor/vgmstream-src/*/LICENSE
            vendor/unluac-build/libunluac.dylib
            vendor/unluac-build/LICENSE-unluac.txt
          key: vendor-${{ runner.os }}-${{ hashFiles('app/packaging/build-vgmstream.sh', 'app/packaging/build-unluac.sh') }}

      - name: Build vgmstream
        if: steps.vendor.outputs.cache-hit != 'true'
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          app/packaging/build-vgmstream.sh

      - name: Build unluac
        if: steps.vendor.outputs.cache-hit != 'true'
        run: app/packaging/build-unluac.sh

      - name: Regression (headless, CUE4Parse fixtures)
        run: |
          dotnet build app/FModel.Snapshot -v q
          fixtures=upstream/CUE4Parse/CUE4Parse.Tests/Fixtures
          out="$RUNNER_TEMP/regression"
          FMODEL_USMAP="$fixtures/Mappings/CUE4ParseFixtures-Oodle.usmap" FMODEL_DATA_DIR="$out/data" \
            dotnet app/FModel.Snapshot/bin/Debug/net10.0/FModel.Snapshot.dll "$fixtures/UE5_8" "$out" < /dev/null | tee "$RUNNER_TEMP/regression.log"
          # 7 of the 8 queued assets export; AS_Fixture's ACL compression isn't in the fixtures
          grep -q "^Export Session: 7 ok, 1 failed" "$RUNNER_TEMP/regression.log"
          echo "$(ls "$out"/*.png | wc -l | tr -d ' ') screenshots"

      - name: Upload regression screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-screenshots
          path: ${{ runner.temp }}/regression/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Package FModel.app
        run: |
          app/packaging/build-app.sh
          codesign --verify --deep --strict app/dist/FModel.app
          ditto -c -k --sequesterRsrc --keepParent app/dist/FModel.app "$RUNNER_TEMP/FModel-macos-arm64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: FModel-macos-arm64
          path: ${{ runner.temp }}/FModel-macos-arm64.zip
          retention-days: 14

  release:
    name: Attach to release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: FModel-macos-arm64
      - name: Upload to ${{ github.event.release.tag_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="FModel-${{ github.event.release.tag_name }}-macos-arm64.zip"
          mv FModel-macos-arm64.zip "$zip"
          gh release upload "${{ github.event.release.tag_name }}" "$zip" --repo "${{ github.repository }}" --clobber
