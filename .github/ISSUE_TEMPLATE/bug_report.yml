name: Bug report
description: Something in FModel for macOS doesn't work or looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! This tracker is for **this macOS port** only. Problems that also happen in the
        official FModel on Windows belong to [4sval/FModel](https://github.com/4sval/FModel) or
        [CUE4Parse](https://github.com/FabianFG/CUE4Parse).

        Please don't attach game files, AES keys or other content you don't have the right to share.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FModel for macOS version
      description: Help › About FModel, or the release you downloaded.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.5, MacBook Pro M3
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game and UE version
      description: The game, the UE version selected in the profile, and whether it uses Pak or IoStore archives.
      placeholder: Some Game, GAME_UE5_4, IoStore
  - type: input
    id: asset
    attributes:
      label: Asset path
      description: The package or folder involved, if any.
      placeholder: Game/Content/Characters/Hero/SK_Hero.uasset
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: |
        The latest file in `~/Library/Logs/FModel/` (Finder › Go › Go to Folder…). Remove anything you consider
        private before pasting.
      render: text
